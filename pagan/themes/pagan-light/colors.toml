# Pagan — Light
# The site's inverted theme: white ground, near-black ink, and by its own
# design NO blue — every atmospheric token drops to grey in light mode, so
# `accent` stays the site's monochrome #262626.
#
# The ANSI slots do not: a terminal needs distinguishable hues or syntax
# highlighting collapses. They are woodcut inks — oxblood, ochre, moss, slate,
# iron, plum — dark and desaturated enough to sit in the same register.

mode = "light"

accent = "#262626"
selection = "#E0E0E0"
muted = "#7b7b7b"

background = "#FFFFFF"
dark_background = "#F5F5F5"
darker_background = "#E8E8E8"
lighter_background = "#D6D6D6"

foreground = "#141414"
dark_foreground = "#666666"
light_foreground = "#333333"
bright_foreground = "#000000"

red = "#A81E1A"
yellow = "#786020"
orange = "#985220"
green = "#2e694c"
cyan = "#005f74"
blue = "#1E5788"
magenta = "#6A3A62"
brown = "#66452e"

bright_red = "#cf2b28"
bright_yellow = "#886c0e"
bright_green = "#3a7b59"
bright_cyan = "#137790"
bright_blue = "#1471b2"
bright_magenta = "#96538a"
